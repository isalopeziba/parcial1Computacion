<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="bg-light">
<main class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <section class="card shadow-sm p-4" style="width: 100%; max-width: 420px;">
        <h1 class="h3 mb-4 text-center">Iniciar sesión</h1>
        <form id="login-form">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input id="username" name="username" class="form-control" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" class="form-control" required autocomplete="current-password">
            </div>
            <div id="login-error" class="alert alert-danger d-none" role="alert"></div>
            <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
        </form>
    </section>
</main>
<script src="{{ url_for('static', filename='login.js') }}"></script>
</body>
</html>
